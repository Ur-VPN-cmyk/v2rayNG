name: Build Ur VPN APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Sanitize and Clone Native C++ Dependencies
        run: |
          rm -f .gitmodules
          git submodule deinit -f --all || true
          rm -rf AndroidLibXrayLite
          git clone --depth=1 --recurse-submodules https://github.com/2dust/AndroidLibXrayLite.git AndroidLibXrayLite
          find AndroidLibXrayLite -name ".git*" -exec rm -rf {} +

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK, NDK & CMake
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;25.2.9519653 cmake;3.22.1'

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: UrVPN-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
